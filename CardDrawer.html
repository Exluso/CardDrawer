<!DOCTYPE html>
<html>
    <head>
        <title>Card Drawer</title>
        <script src="main.js"></script>
        <link rel="stylesheet" href="styles.css"/>
        <link rel="icon" href="img/poker-hand.svg"/>
    </head>

    <body>
        <dialog id="dialog">
            <div class="in-dialog"> test dialog </div>
            <button id="closeBut">Close</button>
        </dialog>

    <div class="board">
        <h2 class="first">Card Drawer <span class="versionMark">v1.00</span></h2>
        <div class="second">
            <div id="main-line" class="card-line"> </div>
            <div class="line-side-wrapper" data-line="mainLine">
                <button class="clickable drawButton" data-draw-to="secondaryLine">Draw follow up</button>
                <button class="clickable discardCard">Discard last</button>
                <button class="clickable discardLine">Discard line</button>
            </div>
            <div id="secondary-line" class="card-line"> </div>
            <div class="line-side-wrapper" data-line="secondaryLine">
                <button class="clickable discardCard">Discard last</button>
                <button class="clickable discardLine">Discard line</button>
            </div>

        </div>
        <div class="third card-line">
            <div class="board-bottom"> 
                <div class="slot card-back clickable drawButton" id="drawBut" title="Draw a card" data-draw-to="mainLine">&#x1F0A0;</div>
                <div class="slot card-front card-back clickable" id="resetBut" title="Shuffle the deck" >D</div>
            </div>
            <div class="line-side-wrapper">
                <button id="discardBoardBut" class="clickable">Discard board</button>
                <button id="exportStatus" class="clickable">Download status data</button>
                <button id="loadGameStatusFile" class="clickable">Load status data</button>
                <input type="file" id="fileSelector" class="invisible" accept=".txt">
            </div>
        </div>
        <div>
        <div class="debug">
            <h4>DEBUG</h4>
            <button id="refresh">Refresh board</button>
            <button id="logGame">Log game status</button>
        </div>
        </div>
    </div>
    </body>
</html>
